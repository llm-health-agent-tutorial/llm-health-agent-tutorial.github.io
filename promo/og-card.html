<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --teal: #115e59; --teal-dark: #0b3d3a; --coral: #e07a5f; --line: rgba(255,255,255,.22);
    --serif: 'Crimson Pro', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: var(--sans); color: #fff; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 520px at 88% -8%, #1a7a72, transparent 60%),
      linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 100%);
  }
  .pulse { position: absolute; right: -30px; top: 300px; width: 760px; opacity: .13; }
  .wrap { position: relative; padding: 60px 72px; height: 100%; display: flex; flex-direction: column; }
  .badge {
    display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
    background: rgba(255,255,255,.12); border: 2px solid var(--line); color: #eafaf7;
    font-size: 22px; font-weight: 600; padding: 10px 22px; border-radius: 999px;
  }
  .badge .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--coral); }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 72px; line-height: 1.04; margin: 30px 0 0; max-width: 20ch; }
  .trust { font-family: var(--serif); font-weight: 600; font-style: italic; color: #cdeae6; font-size: 38px; margin-top: 12px; }
  .taglines { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .tag {
    background: rgba(255,255,255,.10); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 20px; font-size: 25px; font-weight: 600; color: #eafaf7;
  }
  .url { margin-top: 24px; font-family: var(--serif); font-weight: 700; font-size: 30px; color: #ffd9cb; }
</style></head>
<body>
  <svg class="pulse" viewBox="0 0 980 420" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M0 210 H230 L300 60 L420 390 L505 150 L560 250 H980"/></svg>
  <div class="wrap">
    <div class="badge"><span class="dot"></span> UbiComp/ISWC 2026 · Shanghai · Hands-on Tutorial</div>
    <h1>Prototyping Your Personal LLM Health Agent</h1>
    <div class="trust">Build one you can trust.</div>
    <div class="taglines">
      <span class="tag">Ground every claim</span>
      <span class="tag">Catch confounds</span>
      <span class="tag">Refuse medical advice</span>
      <span class="tag">Runs fully offline</span>
    </div>
    <div class="url">llm-health-agent-tutorial.github.io</div>
  </div>
</body></html>
